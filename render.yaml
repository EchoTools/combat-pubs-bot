services:
  - type: worker
    name: combat-pubs-bot
    runtime: node
    buildCommand: npm install
    startCommand: node bot.js
    disk:
      name: bot-state
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: STATE_FILE
        value: /data/state.json
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: POLL_INTERVAL_MS
        value: 10000
      - key: FILTER_GUILD_ID
        sync: false
      - key: NAKAMA_URL
        sync: false
      - key: NAKAMA_HTTP_KEY
        sync: false
      - key: NAKAMA_USERNAME
        sync: false
      - key: NAKAMA_PASSWORD
        sync: false
